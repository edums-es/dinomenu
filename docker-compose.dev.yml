services:
  postgres:
    image: postgres:16-alpine
    container_name: dinomenu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dinomenu
      POSTGRES_USER: dinomenu
      POSTGRES_PASSWORD: dinomenu
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  backend:
    build: ./backend
    container_name: mariscodelivery-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://dinomenu:dinomenu@postgres:5432/dinomenu
      JWT_SECRET: troque_por_uma_chave_forte_aqui
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: "http://localhost:3000"
    volumes:
      - ./backend:/app          # monta o código — qualquer mudança recarrega
      - uploads_data:/app/uploads
    ports:
      - "8001:8001"
    command: uvicorn server:app --host 0.0.0.0 --port 8001 --reload

  frontend:
    image: node:18-alpine
    container_name: mariscodelivery-frontend
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      REACT_APP_BACKEND_URL: http://localhost:8001
      CHOKIDAR_USEPOLLING: "true"   # necessário no WSL/Windows para hot reload funcionar
      WDS_SOCKET_PORT: 3000
    volumes:
      - ./frontend:/app             # monta o código
      - /app/node_modules           # preserva node_modules do container
    ports:
      - "3000:3000"
    command: sh -c "npm install --legacy-peer-deps --silent && npm start"

volumes:
  postgres_data:
  uploads_data:
