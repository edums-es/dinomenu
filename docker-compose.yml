services:
  postgres:
    image: postgres:16-alpine
    container_name: dinomenu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dinomenu}
      POSTGRES_USER: ${POSTGRES_USER:-dinomenu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dinomenu}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  evolution-api:
    image: atendai/evolution-api:v2.2.3
    container_name: mariscodelivery-evolution
    restart: unless-stopped
    environment:
      SERVER_URL: "http://evolution-api:8080"
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?EVOLUTION_API_KEY is required}
      LANGUAGE: "pt-BR"
      # Sem banco externo — armazena instâncias em volume local
      DATABASE_ENABLED: "false"
      CACHE_REDIS_ENABLED: "false"
      RABBITMQ_ENABLED: "false"
      WEBHOOK_GLOBAL_ENABLED: "false"
      DEL_INSTANCE: "false"
      # Não armazena mensagens (privacidade)
      STORE_MESSAGES: "false"
      STORE_MESSAGE_UP: "false"
      STORE_CONTACTS: "false"
      STORE_CHATS: "false"
    volumes:
      - evolution_instances:/evolution/instances
    ports:
      - "8080:8080"

  backend:
    build: ./backend
    container_name: mariscodelivery-backend
    restart: unless-stopped
    depends_on:
      - postgres
      - evolution-api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://dinomenu:dinomenu@postgres:5432/dinomenu}
      APP_ENV: ${APP_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      OPENPIX_WEBHOOK_SECRET: ${OPENPIX_WEBHOOK_SECRET:-}
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:?EVOLUTION_API_KEY is required}
      BACKEND_URL: http://backend:8001
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8001:8001"

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-http://localhost:8001}
    container_name: mariscodelivery-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  uploads_data:
  evolution_instances:
