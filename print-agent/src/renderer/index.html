<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EG Delivery Impressora</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand-mark">EG</div>
        <div>
          <strong>EG Delivery</strong>
          <span>Impressora automatica</span>
        </div>
      </header>

      <section id="linkPanel" class="panel link-panel">
        <div class="panel-heading">
          <div>
            <h2>Conectar loja manualmente</h2>
            <p class="muted">Cole a URL/API e o token exibidos no painel da loja.</p>
          </div>
        </div>
        <div class="link-grid">
          <div>
            <label for="apiInput">URL/API</label>
            <input id="apiInput" type="url" placeholder="https://api.easygrowth.com.br/api" autocomplete="off" />
          </div>
          <div>
            <label for="tokenInput">Token da loja</label>
            <input id="tokenInput" type="password" placeholder="Cole o token do programa" autocomplete="off" />
          </div>
        </div>
        <button id="linkStore" class="primary full-width">Salvar token e conectar</button>
        <p id="linkFeedback" class="muted feedback"></p>
      </section>

      <section class="status-card">
        <div class="status-row">
          <span id="statusDot" class="status-dot"></span>
          <div>
            <p id="statusLabel" class="status-label">Iniciando</p>
            <p id="statusHint" class="muted">Verificando conexao com a loja.</p>
          </div>
        </div>
        <div class="metrics">
          <div>
            <span>Ultimo pedido</span>
            <strong id="lastOrder">-</strong>
          </div>
          <div>
            <span>Impressos</span>
            <strong id="printedCount">0</strong>
          </div>
        </div>
      </section>

      <section class="panel">
        <label for="printerSelect">Impressora</label>
        <div class="printer-row">
          <select id="printerSelect">
            <option value="">Impressora padrao do Windows</option>
          </select>
          <button id="refreshPrinters" class="icon-button" title="Atualizar impressoras">R</button>
        </div>
        <p class="muted">Deixe como padrao se a loja usa so uma impressora.</p>
      </section>

      <section class="actions">
        <button id="testPrint" class="primary">Testar impressao</button>
        <button id="restart" class="secondary">Reiniciar conexao</button>
      </section>

      <section id="errorBox" class="error-box hidden">
        <strong>Atencao</strong>
        <p id="errorText"></p>
      </section>

      <footer>
        <button id="openLogs" class="ghost">Abrir logs</button>
        <button id="hideWindow" class="ghost">Ocultar</button>
      </footer>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
