name: Print Agent Release

on:
  workflow_dispatch:
  push:
    tags:
      - "print-agent-v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: print-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build executable
        shell: pwsh
        run: |
          python -m pip install -r requirements-build.txt
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name "EG-Delivery-Print-Agent" app.py

      - uses: actions/upload-artifact@v4
        with:
          name: EG-Delivery-Print-Agent
          path: print-agent/dist/EG-Delivery-Print-Agent.exe

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: print-agent/dist/EG-Delivery-Print-Agent.exe
          generate_release_notes: true
